<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ludamus</title>
<meta name="description" content="Ludamus: igrajmo se! Igrive vaje za angleške besede iz šole.">
<meta name="theme-color" content="#3D8BFD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ludamus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:'Grandstander';src:url(grandstander.woff2) format('woff2');font-weight:600 800;font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible';src:url(atkinson-regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible';src:url(atkinson-bold.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--paper:#EAF3FB;--card:#FFFFFF;--ink:#1F2A44;--soft:#56688A;--line:#D3E4F4;--sun:#FFC93C;--sky:#3D8BFD;--leaf:#1E9E62;--berry:#D93D6E;--okbg:#DDF6E8;--thbg:#ECE6FF;--th:#7B61FF;--tabbg:#FFF0C2;--nobg:#FDE3EB;
--display:'Grandstander','Trebuchet MS',system-ui,sans-serif;--body:'Atkinson Hyperlegible',Verdana,system-ui,sans-serif;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#132039;--card:#1E2C4B;--ink:#EEF3FB;--soft:#A9B9D4;--line:#1C2C4D;--sky:#6AA8FF;--leaf:#3CCB86;--berry:#FF6E98;--okbg:#18402F;--thbg:#2E2552;--th:#A894FF;--tabbg:#1F4B57;--nobg:#4A1D30;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#132039;--card:#1E2C4B;--ink:#EEF3FB;--soft:#A9B9D4;--line:#1C2C4D;--sky:#6AA8FF;--leaf:#3CCB86;--berry:#FF6E98;--okbg:#18402F;--thbg:#2E2552;--th:#A894FF;--tabbg:#1F4B57;--nobg:#4A1D30;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--line) 35px 37px);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent}
#app{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[role=button]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,label:focus-within{outline:3px solid var(--sky);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.1}
.word{font-family:var(--display);font-weight:800;overflow-wrap:anywhere}
.caps .word{text-transform:uppercase}
.press{background:var(--card);border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.press:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.press:disabled{opacity:.5}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:8px 0 18px}
.hero h1{font-size:clamp(34px,9vw,52px);font-weight:800}
.hero p{margin:6px 0 0;color:var(--soft)}
.brand{display:flex;align-items:center;gap:4px}
.brand h1{line-height:0}
.brand .owl{width:62px;height:auto;display:block}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#splash{position:fixed;inset:0;z-index:100;cursor:pointer;-webkit-tap-highlight-color:transparent}
#splash .sbg{position:absolute;inset:0;background:var(--paper)}
#splash .obox{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;opacity:0;will-change:transform}
#splash .owl{width:100%;height:100%;display:block;overflow:visible}
#splash .wl,#splash .wr,#splash .eyes{transform-box:view-box}
#splash .wl{transform-origin:31px 62px}#splash .wr{transform-origin:89px 62px}#splash .eyes{transform-origin:60px 55px}
#splash.fade{opacity:0;transition:opacity .35s ease}
body.flying .hero .owl{visibility:hidden}
.hlab .clspill{font-size:15px;margin-left:8px;vertical-align:4px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:52%}
.stars{font-family:var(--display);font-weight:800;background:var(--sun);color:#1F2A44;border-radius:999px;padding:6px 12px;white-space:nowrap}
.pill{border-radius:999px;padding:5px 12px;font-family:var(--display);font-weight:800;min-width:60px;white-space:nowrap}
.pill.off{opacity:.5;text-decoration:line-through}
.note{font-size:15px;color:var(--soft);background:var(--card);border-left:4px solid var(--sun);border-radius:6px;padding:8px 12px;margin:0 0 16px}
.banner{display:flex;align-items:center;gap:10px;background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;margin:0 0 16px;font-size:16px}
.banner span{flex:1}
.label{font-size:20px;margin:6px 0 10px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;margin:0 -2px}
.chip{flex-shrink:0;border-radius:999px;padding:8px 16px;background:var(--card);border:2.5px solid var(--ink);font-weight:700}
.chip small{color:var(--soft);font-weight:400;margin-left:4px}
.chip.on{background:var(--c);color:#1F2A44;box-shadow:0 4px 0 var(--ink)}
.chip.on small{color:#1F2A44}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--berry);margin-left:6px;vertical-align:middle}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:14px 0 26px}
.game{border-radius:20px;padding:18px 16px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;min-width:0;width:100%}
.game b,.game .txt{min-width:0;overflow-wrap:anywhere;hyphens:auto}
.game .ico{font-size:42px;line-height:1}
.game b{font-family:var(--display);font-size:24px}
.game span{color:var(--soft);font-size:16px;line-height:1.3}
.ghost{background:transparent;border:2px dashed var(--soft);border-radius:14px;padding:12px 18px;color:var(--soft);font-weight:700;width:100%}
.loading{text-align:center;color:var(--soft);padding:40px 0}
.bar{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.bar h2{flex:1;font-size:26px}
.back{border-radius:999px;padding:6px 14px;font-weight:700}
.instr{color:var(--soft);margin:0 0 16px}
.stage{display:flex;flex-direction:column;align-items:center;gap:20px}
.flash{position:relative;width:min(100%,360px);height:340px;perspective:1000px;cursor:pointer;transform:rotate(-1.5deg)}
.flash .inner{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border:2.5px solid var(--ink);border-radius:8px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center}
.face.back{transform:rotateY(180deg)}
.tape{position:absolute;top:-14px;left:50%;width:110px;height:28px;margin-left:-55px;background:var(--c);opacity:.85;transform:rotate(3deg);z-index:2;border-radius:2px}
.badge{position:absolute;top:14px;right:14px;background:var(--berry);color:#fff;font-family:var(--display);font-weight:800;font-size:14px;padding:3px 10px;border-radius:999px}
.face .pic{font-size:110px;line-height:1}
.face .pic.small{font-size:56px}
.face .word{font-size:clamp(28px,8vw,40px)}
.face .hint{color:var(--soft);font-size:15px}
.row{display:flex;gap:14px;align-items:center}
.round{width:58px;height:58px;border-radius:50%;font-size:30px;font-weight:800;line-height:1;flex-shrink:0}
.big{border-radius:16px;padding:12px 22px;font-family:var(--display);font-weight:800;font-size:20px;background:var(--sun);color:#1F2A44}
.count{color:var(--soft);margin:0}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col{display:flex;flex-direction:column;gap:12px}
.tile{border-radius:14px;padding:12px 10px;min-height:64px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.tile .p{font-size:30px}
.tile .word{font-size:19px}
.tile.sel{background:var(--sun);color:#1F2A44}
.tile.ok{background:var(--okbg);border-color:var(--leaf);box-shadow:0 2px 0 var(--leaf);opacity:.75}
.tile.no{background:var(--nobg);border-color:var(--berry);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.win{text-align:center;font-family:var(--display);font-weight:800;font-size:28px;margin:22px 0 12px}
.center{display:flex;justify-content:center}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mem[data-n="4"],.mem[data-n="8"],.mem[data-n="16"],.mem[data-n="20"]{grid-template-columns:repeat(4,1fr)}
@media (min-width:560px){.mem{grid-template-columns:repeat(4,1fr)}.mem[data-n="5"],.mem[data-n="6"]{grid-template-columns:repeat(3,1fr)}.mem[data-n="20"]{grid-template-columns:repeat(5,1fr)}}
.mem.mg{grid-template-columns:repeat(var(--c1),1fr)}
@media (min-width:560px){.mem.mg{grid-template-columns:repeat(var(--c2),1fr)}}
.mem.dense .mcard{aspect-ratio:4/5}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper .chip{width:44px;height:44px;padding:0;font-size:22px;line-height:1}
.stepper b{min-width:2ch;text-align:center;font-family:var(--display);font-size:22px}
.mem.dense{gap:8px}.mem.dense .p{font-size:26px}.mem.dense .word{font-size:13px}.mem.dense .mcard.down{font-size:26px}
.sizes{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.sizes span{color:var(--soft);margin-right:4px}
.sizes .chip{padding:5px 14px}
.sizes .chip:disabled{opacity:.4}
.mcard{aspect-ratio:3/4;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center}
.mcard.down{background:var(--sky);background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.35) 0 18%,transparent 19%);color:#fff;font-family:var(--display);font-size:34px;font-weight:800}
.mcard .p{font-size:34px;line-height:1}
.mcard .word{font-size:15px}
.mcard.ok{background:var(--okbg);border-color:var(--leaf);box-shadow:0 2px 0 var(--leaf)}
.mcard.no{background:var(--nobg);border-color:var(--berry);animation:shake .35s}
.spell-pic{font-size:96px;line-height:1}
.spell-sl{font-size:20px;color:var(--soft)}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.slot{width:44px;height:54px;border:0;border-bottom:4px solid var(--ink);background:transparent;font-size:28px;padding:0;border-radius:4px}
.slot.full{background:var(--card)}
.slot.bad{background:var(--nobg);border-color:var(--berry);animation:shake .35s}
.slot.good{background:var(--okbg);border-color:var(--leaf)}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:420px}
.ltile{width:52px;height:56px;border-radius:12px;font-size:28px;padding:0;background:var(--sun);color:#1F2A44}
.ltile.used{visibility:hidden}
@media (max-width:380px){.slot{width:36px;height:48px;font-size:24px}.ltile{width:46px;height:50px;font-size:24px}}
.mcard.gone{background:transparent;border:2.5px dashed var(--soft);font-family:var(--display);font-size:34px;color:var(--soft)}
.peek{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--paper);z-index:20;font-family:var(--display);font-weight:800;font-size:34px}
.peek .p{font-size:110px;line-height:1}
.listen{width:120px;height:120px;border-radius:50%;font-size:52px;background:var(--sun)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:420px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:420px}
.opt{border-radius:18px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px;justify-content:center}
.opt .p{font-size:54px;line-height:1}
.opt .word{font-size:16px}
.opt.ok{background:var(--okbg);border-color:var(--leaf)}
.opt.no{background:var(--nobg);border-color:var(--berry)}
.fb{text-align:center;font-size:20px}
.fb strong{font-family:var(--display);display:block;font-size:26px;margin-bottom:4px}
.msg{background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:20px;text-align:center}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:16px;padding:16px;margin-bottom:16px}
.card h3{font-size:21px;margin-bottom:6px}
.card .instr{margin-bottom:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sm{border-radius:12px;padding:8px 16px;font-weight:700}
.linkbtn{display:inline-block;text-decoration:none;color:inherit}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}
.danger{background:transparent;border:2px solid var(--berry);color:var(--berry);border-radius:12px;padding:6px 14px;font-weight:700}
textarea,select,.f2 input,.form input,.prow input{font:inherit;font-size:16px;padding:10px;border:2px solid var(--soft);border-radius:10px;background:var(--paper);color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;margin-bottom:10px;line-height:1.4}
code{background:var(--paper);padding:1px 6px;border-radius:6px;font-size:15px}
.prev{margin-top:16px;border-top:2px dashed var(--line);padding-top:14px}
.prev h4{font-size:19px;margin:0 0 10px}
.prev label{display:block;font-weight:700;margin-bottom:10px}
.prev label select{margin-top:4px;font-weight:400}
.ntf{display:grid;grid-template-columns:64px 1fr 1fr;gap:6px;margin-bottom:12px}
.prow{display:grid;grid-template-columns:52px 1fr 1fr 36px;gap:6px;margin-bottom:6px;align-items:center}
.prow.miss .pic-in{border-color:var(--berry);background:var(--nobg)}
.pic-in{text-align:center;padding:8px 2px!important}
.hint{color:var(--soft);font-size:15px;margin:8px 0 12px}
.ukhint{font-size:14px;color:var(--ink);background:var(--nobg);border-radius:8px;padding:6px 10px;margin:-2px 0 10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ukhint .sm{padding:3px 10px;font-size:14px}
.chg h4{font-size:18px;margin:10px 0 4px}.chg h4 small{font-family:var(--body);font-weight:400;color:var(--soft);font-size:14px}
.older summary{cursor:pointer;color:var(--sky);font-weight:700;margin-top:10px}
#helpprev .card{border-width:1.5px}
.fbitem{border-top:1px solid var(--line);padding:10px 0}.fbitem:first-of-type{border-top:0}
.fbitem.new{border-left:4px solid var(--sun);padding-left:10px}
.fbmeta{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--soft)}.fbmeta .x{margin-left:auto}
.fbitem p{margin:6px 0 0}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding-bottom:4px}
.hstep{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;padding:14px 14px 16px;margin:0 0 16px}
.hlab{font-size:22px;font-weight:800;margin:0 0 10px}
.hqrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 10px}
.hq{margin:0;color:var(--soft);font-size:16px}
.ftabs{display:flex;align-items:stretch}
.ftab{flex:1 1 0;min-width:0;border:2.5px solid var(--ink);border-radius:14px 14px 0 0;background:var(--paper);padding:10px 4px;margin:0;font-family:var(--display);font-weight:800;font-size:17px;color:var(--soft);position:relative}
.ftab+.ftab{margin-left:-2.5px}
.ftab.on{background:var(--tabbg);color:var(--ink);border-bottom-color:var(--tabbg);z-index:1}
.fpanel{background:var(--tabbg);border:2.5px solid var(--ink);border-top:0;border-radius:0 0 16px 16px;padding:10px}
.hstep.hgame{padding-left:6px;padding-right:6px}
.hstep.hgame .hlab,.hstep.hgame .hqrow{margin-left:8px;margin-right:8px}
.fpanel .games{margin:0}
.qbtn{width:36px;height:36px;border-radius:50%;font-family:var(--display);font-weight:800;font-size:20px;line-height:1;padding:0;flex-shrink:0;box-shadow:0 3px 0 var(--ink)}
.qbtn.on{background:var(--sun);color:#1F2A44}
.games.compact{gap:10px}
/* 2.9: preprostejša izbira igre in barvne ploščice iger */
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.hhead .hlab{margin:0}
.gmode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.gmode button{border-radius:14px;padding:10px 6px;font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.gmode button.on{background:var(--sun);color:#1F2A44}
.games.gtiles{gap:10px;margin:0;max-width:none;grid-template-columns:repeat(2,minmax(0,1fr))}
.games.gtiles .game.press{box-shadow:0 4px 0 var(--ink)}
.games.gtiles .game{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:10px;row-gap:8px;min-height:0;padding:12px 10px;border-radius:16px;background:var(--card);background:color-mix(in srgb,var(--gc) 18%,var(--card))}
.games.gtiles .game .ico{width:42px;height:42px;border-radius:11px;background:var(--card);border:2.5px solid var(--gc);display:flex;align-items:center;justify-content:center;font-size:23px;line-height:1;flex-shrink:0}
.games.gtiles .game b{font-size:17px;line-height:1.15;color:var(--ink);hyphens:manual;overflow-wrap:normal}
.games.gtiles .game>span:not(.ico):not(.txt){display:none}
.games.gtiles.withdesc .game>span:not(.ico):not(.txt){display:block;grid-column:1/-1;color:var(--soft);font-size:15px;line-height:1.3}
.games.gtiles.withdesc .game{align-content:start}
.morehelp{display:flex;justify-content:center;margin-top:14px}
@media (max-width:350px){.games.gtiles .game{column-gap:8px;padding:10px 8px}.games.gtiles .game .ico{width:34px;height:34px;font-size:19px;border-radius:9px}.games.gtiles .game b{font-size:15px}}
.games.gtiles .game.wide{min-height:0;flex-direction:row;align-items:center;gap:12px}
.games.gtiles .game.wide .txt span{color:var(--soft);font-size:15px}
.botrow .botbtn{border-radius:999px;padding:12px 8px;font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink)}
.note.voice{display:flex;gap:10px;align-items:flex-start}.note.voice span{flex:1}
.note.voice .x{background:none;border:0;font-size:22px;line-height:1;color:var(--soft);padding:0 2px;cursor:pointer}
.games.compact .game{min-height:0;flex-direction:row;align-items:center;gap:10px;padding:12px;border-radius:16px}
.games.compact .game .ico{flex-shrink:0}
.games.compact .game .ico{font-size:30px}
.games.compact .game b{font-size:18px;line-height:1.15}
.games.compact .game span:not(.ico):not(.txt),.games.compact .game .txt span{display:none}
.games.compact .game.wide .txt{gap:0}
@media (max-width:380px){.ftab{font-size:15px}.hstep{padding:12px}}
.chip.allt{background:transparent;border-style:dashed;color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;margin:8px 0 4px}
.seg button{border:0;background:var(--card);padding:10px 4px;font-family:var(--display);font-weight:800;font-size:18px}
.seg button.on{background:var(--sun);color:#1F2A44}
.seg button+button{border-left:2.5px solid var(--ink)}
.botrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.botrow .ghost{padding:10px 6px;font-size:15px}
.clspill{font-family:var(--body);font-size:16px;font-weight:700;border-radius:999px;padding:3px 12px;vertical-align:middle;margin-left:6px}
.clsgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

const APP_VERSION='2.9';
const FEEDBACK_EMAIL='uzbmobileapps@gmail.com'; // mnenja se pošljejo iz uporabnikovega poštnega programa

   Ameriške oblike pri vnosu zaznamo s US_UK in predlagamo britansko različico. */
const US_UK={color:'colour',colors:'colours',colored:'coloured',favorite:'favourite',favorites:'favourites',gray:'grey',center:'centre',theater:'theatre',meter:'metre',liter:'litre',
neighbor:'neighbour',neighbors:'neighbours',honor:'honour',humor:'humour',flavor:'flavour',behavior:'behaviour',airplane:'aeroplane',airplanes:'aeroplanes',truck:'lorry',trucks:'lorries',
candy:'sweets',cookie:'biscuit',cookies:'biscuits',mom:'mum',mommy:'mummy',moms:'mums',pants:'trousers',sneakers:'trainers',eraser:'rubber',erasers:'rubbers',soccer:'football',
apartment:'flat',elevator:'lift',vacation:'holiday',mailman:'postman',trash:'rubbish',garbage:'rubbish','french fries':'chips','potato chips':'crisps',zucchini:'courgette',
eggplant:'aubergine',flashlight:'torch',diaper:'nappy',sidewalk:'pavement',faucet:'tap',movie:'film',movies:'films',math:'maths','parking lot':'car park','gas station':'petrol station',
pajamas:'pyjamas',jewelry:'jewellery',mustache:'moustache',tire:'tyre',tires:'tyres',traveling:'travelling',traveled:'travelled'};
function ukHints(text){const out=[];const t=String(text||'');for(const us of Object.keys(US_UK)){const re=new RegExp('(^|[^a-z])('+us.replace(/ /g,'\\s+')+')(?=$|[^a-z])','i');if(re.test(t))out.push([us,US_UK[us]])}return out}
function ukFix(text){let t=String(text||'');for(const [us,uk] of ukHints(t)){t=t.replace(new RegExp('(^|[^a-zA-Z])('+us.replace(/ /g,'\\s+')+')(?=$|[^a-zA-Z])','gi'),(m,a,w)=>a+(w[0]===w[0].toUpperCase()?uk[0].toUpperCase()+uk.slice(1):uk))}return t}
const AB=window.AndroidBridge||null;
const PAL=['#FFC93C','#6FB7FF','#5FD39A','#FF9EC4','#B79CFF','#FFB067'];
const NEW_DAYS=14;

/* ---------- shramba ---------- */
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

/* SOVICA: logotip v glavi in na uvodnem zaslonu. */
const OWL='<svg class="owl" viewBox="24 10 72 102" aria-hidden="true" focusable="false"><path d="M30 42 L35 16 L50 32 H70 L85 16 L90 42 V80 Q90 104 60 104 Q30 104 30 80 Z" fill="#3D8BFD"/><ellipse cx="60" cy="88" rx="16" ry="10" fill="#8DBBFF"/><circle cx="47" cy="54" r="13" fill="#fff"/><circle cx="73" cy="54" r="13" fill="#fff"/><circle cx="48" cy="56" r="6" fill="#17324D"/><circle cx="74" cy="56" r="6" fill="#17324D"/><path d="M55 66 H65 L60 74 Z" fill="#F0A21A"/><ellipse cx="51" cy="106" rx="5" ry="3" fill="#F0A21A"/><ellipse cx="69" cy="106" rx="5" ry="3" fill="#F0A21A"/></svg>';
/* SPOMIN: število parov od 3 do 12; mreža kartic glede na število kartic. */
const MEM_MIN=3,MEM_MAX=12;
function memGrid(n,extra){const c1=n<=6?3:4,c2=n<=6?3:n<=16?4:n===20?5:6;return `class="mem mg ${n>=16?'dense':''} ${extra||''}" style="--c1:${c1};--c2:${c2}" data-n="${n}"`}
function pairStepper(cur,avail,act){const max=Math.min(MEM_MAX,avail);return `<span class="stepper"><button class="chip press" data-act="${act}" data-n="${cur-1}" ${cur<=MEM_MIN?'disabled':''} aria-label="Manj parov">−</button><b aria-live="polite">${cur}</b><button class="chip press" data-act="${act}" data-n="${cur+1}" ${cur>=max?'disabled':''} aria-label="Več parov">+</button></span>`}
const S={view:'home',topic:'all',caps:true,stars:0,memPairs:6,duoPairs:6,slo:true,sfx:true,subject:'ang',stats:true,cls:'',tab:'one',desc:false,mix:[],multi:false,msel:[],animal:'🦊',q:'',loaded:false,status:'',edOpen:null,dirty:{my:false,pub:false}};
(function(){const p=lsGet('besede-prefs',{});if(typeof p.caps==='boolean')S.caps=p.caps;if(p.stars)S.stars=p.stars;if(Number.isInteger(p.memPairs)&&p.memPairs>=MEM_MIN&&p.memPairs<=MEM_MAX)S.memPairs=p.memPairs;if(typeof p.slo==='boolean')S.slo=p.slo;if(p.animal)S.animal=p.animal;if(Number.isInteger(p.duoPairs)&&p.duoPairs>=MEM_MIN&&p.duoPairs<=MEM_MAX)S.duoPairs=p.duoPairs;if(typeof p.sfx==='boolean')S.sfx=p.sfx;if(typeof p.stats==='boolean')S.stats=p.stats;if(p.cls)S.cls=p.cls;if(p.tab==='two')S.tab='two';if(p.desc===true)S.desc=true;if(Array.isArray(p.mix))S.mix=p.mix;if(p.subject)S.subject=p.subject})();
function savePrefs(){lsSet('besede-prefs',{caps:S.caps,stars:S.stars,memPairs:S.memPairs,slo:S.slo,animal:S.animal,duoPairs:S.duoPairs,sfx:S.sfx,subject:S.subject,stats:S.stats,cls:S.cls,tab:S.tab,desc:S.desc,mix:S.mix})}

let PUB=lsGet('besede-cache',null)||{topics:[]};
let MY=lsGet('moje-besede',null)||{topics:[]};
let ADM=null,PREV=null;const PASTE={my:'',pub:''};
/* REPOZITORIJ: na github.io ga aplikacija prebere iz naslova, na lastni domeni (ludamus.si) velja spodnji privzeti. */
const REPO_HOME={owner:'urbanzb',repo:'ludamus'};
const CFG=Object.assign({owner:'',repo:'',branch:'main',token:''},lsGet('skrbnik',{}));
if(/\.github\.io$/i.test(location.hostname)){CFG.owner=location.hostname.split('.')[0];const seg=location.pathname.split('/').filter(Boolean)[0];CFG.repo=seg&&!/\.html?$/i.test(seg)?seg:location.hostname}
else{if(!CFG.owner)CFG.owner=REPO_HOME.owner;if(!CFG.repo)CFG.repo=REPO_HOME.repo}

const app=document.getElementById('app');
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const clone=o=>JSON.parse(JSON.stringify(o));
function besed(n){const m=n%100;return n+' '+(m===1?'beseda':m===2?'besedi':(m===3||m===4)?'besede':'besed')}
function isNew(w){return !!w.added&&(Date.now()-new Date(w.added+'T00:00:00').getTime())<NEW_DAYS*864e5}
/* Predmeti. Zaenkrat je en sam (angleščina) in ga uporabnik ne vidi.
   Za nov predmet: v besede.json dodaj seznam "subjects" in temam polje "subject" (npr. "mat"),
   na začetni zaslon pa izbiro predmeta, ki nastavi S.subject. Igre uporabljajo pare a = b (en/sl). */
const DEFAULT_SUBJECTS=[{id:'ang',name:'Angleščina',icon:'🇬🇧',title:'Angleške besede',a:'angleško',b:'slovensko',langA:'en-GB',langB:'sl'}];
function subjects(){return Array.isArray(PUB.subjects)&&PUB.subjects.length?PUB.subjects:DEFAULT_SUBJECTS}
function SUBJ(){return subjects().find(x=>x.id===S.subject)||subjects()[0]}
/* RAZREDI: teme imajo polje "classes" (npr. ["1a"]). Teme brez njega pripadajo prvemu razredu.
   Lastne teme staršev (my-*) so vidne v vseh razredih. Seznam razredov ureja skrbnik (besede.json "classes"). */
const DEFAULT_CLASSES=[{id:'1a',name:'1.a'},{id:'1b',name:'1.b'}];
function classes(){return Array.isArray(PUB.classes)&&PUB.classes.length?PUB.classes:DEFAULT_CLASSES}
function CLS(){return classes().find(c=>c.id===S.cls)||classes()[0]}
function topicClasses(t,list){const cl=list||classes();return Array.isArray(t.classes)&&t.classes.length?t.classes:[cl[0].id]}
function applyHashClass(){const hsh=decodeURIComponent(location.hash.replace(/^#/,'')).toLowerCase().replace(/[.\s]/g,'');if(!hsh)return;
  const c=classes().find(x=>x.id.toLowerCase()===hsh||x.name.toLowerCase().replace(/[.\s]/g,'')===hsh);
  if(c){S.cls=c.id;S.topic='all';savePrefs();try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}}
function topicsRaw(){return (PUB.topics||[]).concat(MY.topics||[])}
function pushRecent(id){if(!id||['all','novo','vadi'].includes(id))return;const r=lsGet('zadnje-teme',[]).filter(x=>x!==id);r.unshift(id);lsSet('zadnje-teme',r.slice(0,12))}
function topicsAll(){const id=SUBJ().id,c=CLS().id;return topicsRaw().filter(t=>(t.subject||'ang')===id&&(String(t.id).startsWith('my-')||topicClasses(t).includes(c)))}

/* Pametno ponavljanje: za vsako besedo štejemo pravilne (o) in napačne (b) odgovore. */
/* ANONIMNA STATISTIKA: v Firebase pošiljamo le dnevne seštevke (npr. »spomin začet: 5«),
   brez oznake uporabnika ali naprave. Lastne besede staršev (teme my-*) se nikoli ne pošiljajo. */
let STQ=lsGet('stat-vrsta',{});let stTimer=null,stBusy=false,sessionCounted=false;
function dayKey(){return today()}
function stKey(k){return encodeURIComponent(String(k)).replace(/\./g,'%2E').slice(0,180)}
function track(key,n){if(!S.stats||!key)return;const d=dayKey();STQ[d]=STQ[d]||{};STQ[d][key]=(STQ[d][key]||0)+(n||1);lsSet('stat-vrsta',STQ);clearTimeout(stTimer);stTimer=setTimeout(flushStats,15000)}
function trackMiss(w){if(!w||!w.key||String(w.key).startsWith('my-'))return;track('m/'+stKey(w.key))}
function platform(){return AB?'apk':isIOS()?'ios':isAndroid()?'android':'splet'}
/* ŠTETJE NAPRAV BREZ OZNAKE: telefon si zapomni, ali je danes oz. ta mesec že poslal »+1«, in pošlje le seštevek.
   Nobene oznake naprave ali uporabnika ne pošiljamo. Način: apk, nam (nameščena spletna aplikacija), brs (brskalnik). */
function devMode(){return AB?'apk':isStandalone()?'nam':'brs'}
function devTick(){if(!S.stats)return;const d=today(),m=d.slice(0,7),md=devMode();
  if(!lsGet('st-naprava',false)){track('dev_new');track('dev_new_'+md);lsSet('st-naprava',true)}
  if(lsGet('st-dan','')!==d){track('dev_day');track('dev_day_'+md);lsSet('st-dan',d)}
  if(lsGet('st-mesec','')!==m){track('dev_mon');track('dev_mon_'+md);lsSet('st-mesec',m)}}
function trackOpen(){devTick();if(sessionCounted)return;sessionCounted=true;track('open');track('cls_'+CLS().id);track('plat_'+platform());track('v_'+APP_VERSION.replace(/\./g,'_'))}
async function flushStats(){
  if(stBusy||!S.stats||!navigator.onLine||!duoReady())return;const days=Object.keys(STQ);if(!days.length)return;
  stBusy=true;const snap=JSON.parse(JSON.stringify(STQ));
  try{const fb=await fbInit();const upd={};
    for(const d of days)for(const k of Object.keys(snap[d]))upd['stats/'+d+'/'+k]=fb.inc(snap[d][k]);
    await fb.update('/',upd);
    for(const d of days){for(const k of Object.keys(snap[d])){STQ[d][k]-=snap[d][k];if(STQ[d][k]<=0)delete STQ[d][k]}if(!Object.keys(STQ[d]).length)delete STQ[d]}
    lsSet('stat-vrsta',STQ)}
  catch(e){}finally{stBusy=false}}
let STATS=lsGet('besede-stat',{});
function stat(w,ok){if(!w||!w.key)return;if(!ok)trackMiss(w);const x=STATS[w.key]||{o:0,b:0};if(ok)x.o++;else x.b++;x.t=Date.now();STATS[w.key]=x;lsSet('besede-stat',STATS)}
function isHard(w){const x=STATS[w.key];return !!x&&x.b>0&&x.b>=x.o}
function weight(w){const x=STATS[w.key];if(!x)return 1.5;return Math.min(6,Math.max(0.4,1+2*x.b-0.6*x.o))}
function wpick(list,n){const a=list.slice(),out=[];while(out.length<n&&a.length){const tot=a.reduce((t,w)=>t+weight(w),0);let r=Math.random()*tot,i=0;for(;i<a.length-1;i++){r-=weight(a[i]);if(r<=0)break}out.push(a.splice(i,1)[0])}return out}
function pool(){const out=[];for(const t of topicsAll()){if(S.topic==='mix'?!(S.mix||[]).includes(t.id):(S.topic!=='all'&&S.topic!=='novo'&&S.topic!=='vadi'&&S.topic!==t.id))continue;for(const w of t.words){const x={...w,color:t.color,key:t.id+'|'+w.en};if(S.topic==='novo'&&!isNew(w))continue;if(S.topic==='vadi'&&!isHard(x))continue;out.push(x)}}return out}

const EM='(?:[0-9#*]\\ufe0f?\\u20e3|\\p{Extended_Pictographic}|\\p{Regional_Indicator}|[\\u200d\\ufe0f\\u{1F3FB}-\\u{1F3FF}])+';
const EMOJI_START=new RegExp('^'+EM,'u'),EMOJI_END=new RegExp(EM+'$','u');
function takeEmoji(s){s=s.trim();let m=s.match(EMOJI_START);if(m)return{pic:m[0],text:s.slice(m[0].length).trim()};m=s.match(EMOJI_END);if(m)return{pic:m[0],text:s.slice(0,s.length-m[0].length).trim()};return{pic:'',text:s}}
function fixText(s,lang){
  s=s.replace(/[´`']/g,'’').replace(/\.\.\./g,'…').replace(/\s*\/\s*/g,' / ').replace(/\s+/g,' ').trim().replace(/^\/\s*|\s*\/$/g,'').trim();
  const letters=s.replace(/[^\p{L}]/gu,'');
  if(!letters||letters!==letters.toLocaleUpperCase('sl'))return s;
  let t=s.toLocaleLowerCase(lang==='sl'?'sl':'en-GB');
  if(/[.?!…]/.test(s))t=t.replace(/(^|[.?!]\s+|\s\/\s)(\p{L})/gu,(m,a,b)=>a+b.toLocaleUpperCase(lang==='sl'?'sl':'en-GB'));
  if(lang==='en')t=t.replace(/(^|[^\p{L}])i(?=$|[^\p{L}])/gu,'$1I');
  return t;
}
function norm(s){return s.toLowerCase().replace(/’/g,"'").replace(/\(.*?\)/g,'').replace(/[.?!…]+/g,'').replace(/\s+/g,' ').trim()}
function guessPic(en){const n=norm(en);if(PICS[n])return PICS[n];const b=n.replace(/^(a|an|the|my|i'm a|i'm)\s+/,'');if(PICS[b])return PICS[b];if(b.endsWith('s')&&PICS[b.slice(0,-1)])return PICS[b.slice(0,-1)];return ''}
function niceName(s){s=s.replace(/[:：]\s*$/,'').trim();return s===s.toUpperCase()?s.charAt(0)+s.slice(1).toLowerCase():s}
function parseList(text){
  const lines=String(text).replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  let topic=null,last=null,expectTopic=false;const items=[];
  for(const raw of lines){
    let l=raw.replace(/^(?:[*•·▪●◦\-–—]+|\d+[.)])\s*/,'').trim();
    if(!l||/^`{3}/.test(l)){last=null;continue}
    let m=l.match(/^#+\s*tema\s*:\s*(.+)$/i);
    if(m){const p=m[1].split('=');const en=takeEmoji(p[0]);const sl=takeEmoji(p[1]||'');topic={en:en.text,sl:sl.text,icon:sl.pic||en.pic};last=null;continue}
    if(/^#/.test(l)){last=null;continue}
    if(expectTopic&&!l.includes('=')){topic={en:niceName(l),sl:'',icon:''};expectTopic=false;last=null;continue}
    m=l.match(/slovar[čc]ek\s+besed\s*\/\s*(.*)$/i);
    if(m){if(m[1].replace(/[:\s]/g,''))topic={en:niceName(m[1]),sl:'',icon:''};else expectTopic=true;last=null;continue}
    if(/^(pesmica|igra|song|game)\s*:/i.test(l)){last=null;continue}
    if(!l.includes('=')){if(last)last.sl=(last.sl+' '+l).trim();continue}
    const i=l.indexOf('=');const left=takeEmoji(l.slice(0,i));const right=takeEmoji(l.slice(i+1));
    last={en:left.text,sl:right.text,pic:left.pic||right.pic};items.push(last);
  }
  for(const it of items){it.en=fixText(it.en,'en');it.sl=fixText(it.sl,'sl');if(!it.pic)it.pic=guessPic(it.en)}
  return{topic,items:items.filter(it=>it.en&&it.sl)};
}

function ghHeaders(){return{Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
function ghRepoUrl(){return `https://api.github.com/repos/${encodeURIComponent(CFG.owner)}/${encodeURIComponent(CFG.repo)}`}
async function ghErr(r){let m='';try{m=(await r.json()).message||''}catch(e){}
  if(r.status===401)return new Error('žeton ni veljaven ali je potekel.');
  if(r.status===403)return new Error('žeton nima pravice za pisanje (Contents: Read and write).');
  if(r.status===404)return new Error('repozitorija ni mogoče najti. Preveri uporabnika, ime repozitorija in to, da ima žeton dostop do njega.');
  if(r.status===409)return new Error('datoteka se je medtem spremenila. Poskusi znova.');
  return new Error(m||('napaka '+r.status))}
function b64(s){const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)}
async function ghPut(path,text,msg){
  const br=CFG.branch||'main',url=ghRepoUrl()+'/contents/'+path;let sha;
  const g=await fetch(url+'?ref='+encodeURIComponent(br)+'&t='+Date.now(),{headers:ghHeaders(),cache:'no-store'});
  if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw await ghErr(g);
  const body={message:msg,content:b64(text),branch:br};if(sha)body.sha=sha;
  const p=await fetch(url,{method:'PUT',headers:Object.assign(ghHeaders(),{'Content-Type':'application/json'}),body:JSON.stringify(body)});
  if(!p.ok)throw await ghErr(p);
}

const DEFAULT_HELP=`# 🚀 Kako začneš
- Ob naslovu **Izberi temo** izberi svoj **razred**, na primer 1.a. Najdeš ga tudi v nastavitvah ⚙️.
- Izberi **temo**. Če je ni med prikazanimi, tapni **Vse teme**. Tam so teme razvrščene po mesecih.
- Za ponavljanje lahko v **Vse teme** tapneš **🧩 Izberi več tem**, označiš več tem in tapneš **Vadi izbrane**.
- Pri **Izberi igro** odgovori na vprašanje »Koliko vas igra?«: **🙋 Igram sam** ali **👫 Igrava dva**. Nato tapni igro. Z gumbom **?** ob naslovu »Izberi igro« pokažeš kratke opise iger. Ta navodila so vedno v **⚙️ Nastavitve → ❓ Navodila**.
- Za vsako končano igro dobiš **zvezdico ⭐**. Koliko jih imaš, vidiš zgoraj desno.

# 🎮 Igre
- **🃏 Kartice:** poglej sliko in poslušaj besedo. Tapni kartico, da vidiš slovensko besedo.
- **🔗 Poveži:** tapni angleško besedo na levi, nato njen slovenski par na desni.
- **🧠 Spomin:** odkrivaj po dve kartici in poišči angleško besedo ter njen slovenski par. Število parov (od 3 do 12) nastaviš zgoraj z gumboma − in +.
- **👂 Poslušaj:** poslušaj besedo in tapni pravo sliko. Z gumbom 🔊 jo slišiš še enkrat.
- **🔤 Sestavi besedo:** iz premešanih črk sestavi angleško besedo. Če ne gre, tapni 💡 Pomoč.
- **🔍 Najdi:** zapomni si, kje je katera slika. Ko se kartice obrnejo, poišči besedo, ki jo slišiš.

# 👫 Igra za dva
- **Spomin na enem telefonu:** vsak izbere svojo živalco. Ko aplikacija napiše »Podaj telefon!«, je na vrsti drugi.
- **Ustvari igro** in **Pridruži se:** eden ustvari igro in prijatelju pove kodo. Drugi kodo vpiše na svojem telefonu.

# 📖 Slovarček
Vse besede na enem mestu. Išči angleško ali slovensko in tapni 🔊, da besedo slišiš.

- **🔁 Ponovi:** besede, ki so ti delale težave. Ko jih večkrat pravilno rešiš, izginejo.

- **🔊 SLO:** vklopi ali izklopi izgovorjavo slovenskih besed.

Ludamus pošilja anonimne skupne seštevke o uporabi aplikacije, na primer kako pogosto se uporablja ter katere igre in besede so priljubljene ali težke.

Seštevki pomagajo izboljševati igre in pokažejo, katere besede iz šole potrebujejo več vaje. Statistiko izklopiš v **⚙️ Nastavitve**.`;

function inlineMd(t){return h(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function mdBlocks(text){let out='',list=false;const close=()=>{if(list){out+='</ul>';list=false}};
  for(const raw of String(text).split('\n')){const l=raw.trim();if(!l){close();continue}
    if(/^[-•*]\s+/.test(l)){if(!list){out+='<ul class="hl">';list=true}out+='<li>'+inlineMd(l.replace(/^[-•*]\s+/,''))+'</li>'}
    else{close();out+='<p>'+inlineMd(l)+'</p>'}}
  close();return out}
function mdSections(text){const secs=[];let cur=null;
  for(const raw of String(text).split('\n')){const m=raw.match(/^#\s+(.+)$/);if(m){cur={title:m[1].trim(),body:''};secs.push(cur)}else{if(!cur){cur={title:'',body:''};secs.push(cur)}cur.body+=raw+'\n'}}
  return secs.filter(x=>x.title||x.body.trim()).map(x=>`<section class="card help">${x.title?`<h3>${inlineMd(x.title)}</h3>`:''}${mdBlocks(x.body)}</section>`).join('')}

async function fbConnect(cfg,name){
  if(window.__FAKE_FB)return window.__FAKE_FB;
  if(!cfg||!cfg.apiKey||!cfg.databaseURL)throw new Error('nastavitve');
  const base='https://www.gstatic.com/firebasejs/'+FBV+'/';
  const [a,au,d]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-database.js')]);
  const app=a.getApps().find(x=>x.name===name)||a.initializeApp(cfg,name);const auth=au.getAuth(app);
  if(auth.authStateReady)await auth.authStateReady();
  if(!auth.currentUser)await au.signInAnonymously(auth);
  const db=d.getDatabase(app);
  return{ref:p=>d.ref(db,p),get:d.get,set:d.set,remove:d.remove,onValue:d.onValue,tx:d.runTransaction,onDisconnect:d.onDisconnect,update:(p,o)=>d.update(d.ref(db,p),o),inc:n=>d.increment(n),
  };
}

function fbErrText(e){const t=String((e&&(e.code||''))+' '+(e&&e.message||e)).toLowerCase();

  if(t.includes('admin-restricted'))return 'V Firebase ni vklopljena anonimna prijava (Authentication → Sign-in method → Anonymous).';
  if(t.includes('permission'))return 'Firebase je zavrnil dostop. Preveri, ali so v Realtime Database objavljena pravila (Rules).';
  if(!navigator.onLine)return 'Telefon ni povezan z internetom.';
  if(t.includes('network')||t.includes('fetch')||t.includes('import')||t.includes('load'))return 'Telefon ne doseže strežnikov Firebase. To se zgodi v brskalnikih, ki blokirajo sledilce (npr. DuckDuckGo), ali z blokatorjem oglasov ali VPN. Odpri aplikacijo, nameščeno iz Chroma, ali APK.';
  return 'Povezava ni uspela ('+String(e&&(e.code||e.message)||e).slice(0,80)+'). Poskusi znova.'}

    cards:shuffle(pick.flatMap(w=>[{k:w.key,t:'en',pic:w.pic,en:w.en,sl:w.sl},{k:w.key,t:'sl',pic:w.pic,en:w.en,sl:w.sl}]))}}

  if(uniqPics(pool()).length<3){D.err='Za igro potrebuješ vsaj 3 besede v izbrani temi.';return render()}
  D.phase='connecting';D.err='';render();
  try{const fb=await fbInit();
    for(let n=0;n<8;n++){const code=String(1000+Math.floor(Math.random()*9000)),r=fb.ref('rooms/'+code),room=newRoom();
      const res=await fb.tx(r,cur=>{if(cur&&Date.now()-(cur.created||0)<3*3600e3)return;return room});
      const made=res&&res.snapshot&&res.snapshot.val();
      if(res.committed&&made&&made.created===room.created){track('gs_duo');track('t_'+stKey(S.topic));D.code=code;D.role='h';D.ref=r;fb.onDisconnect(r).remove();duoListen();D.phase='wait';return renderIfDuo()}}
    throw new Error('koda')}catch(e){duoFail(e)}

    let animal=D.animal;if(animal===cur.host)animal=ANIMALS.find(a=>a!==cur.host);
    D.ref=r;D.role='g';D.code=code;D.animal=animal;await duoListen();

    if(v.guestGone&&D.role==='h'){D.phase='left';D.err='Prijatelj je zapustil igro.';return renderIfDuo()}
    if(v.state==='play'||v.state==='done')D.phase=v.state;
    if(v.state==='play')D.starred=false;
    if(v.state==='done'&&!D.starred){D.starred=true;star();gameDone('duo')}

}
async function duoFlip(i){const v=D&&D.room;if(!v||v.state!=='play'||v.turn!==D.role||v.pending)return;const o=v.open||[];if(o.includes(i)||(v.matched&&v.matched['c'+i]))return;

    PREV=null;PASTE[k]='';S.dirty[k]=true;S.edOpen=t.id;S.status=`Dodano: ${besed(added)}${skipped?`, ${skipped} že obstaja`:''}. ${k==='my'?'Ne pozabi shraniti.':'Ko je vse prav, tapni »Objavi za vse«.'}`;render();break}
  case 'addw':{const d=DS(k),t=d.topics[+b.dataset.t],id=k+'-'+b.dataset.t,en=val('en-'+id),sl=val('sl-'+id),pic=val('pic-'+id)||guessPic(en)||'⭐';
    S.edOpen=t.id;if(!en||!sl){S.status='Vpiši angleško in slovensko besedo.';return render()}
    t.words.push({en,sl,pic,added:today()});S.dirty[k]=true;const uh=ukHints(en);S.status=uh.length?'Dodano: '+en+'. Pozor, to je ameriška oblika. Britansko: '+uh.map(x=>x[1]).join(', ')+'.':'Dodano: '+en+'.';render();const f=document.getElementById('en-'+id);if(f)f.focus();break}
  case 'delw':{const t=DS(k).topics[+b.dataset.t];S.edOpen=t.id;t.words.splice(i,1);S.dirty[k]=true;S.status='Beseda izbrisana.';render();break}
  case 'delt':{const d=DS(k),t=d.topics[+b.dataset.t];if(!confirm('Izbrišem temo '+t.name+' z vsemi besedami?'))break;d.topics.splice(+b.dataset.t,1);S.dirty[k]=true;S.status='Tema izbrisana.';render();break}
  case 'addt':{const name=val('nt-en-'+k),sl=val('nt-sl-'+k)||name,icon=val('nt-ico-'+k)||'📘';if(!name){S.status='Vpiši ime nove teme.';return render()}
    const t=makeTopic(k,name,sl,icon);if(k==='pub')t.classes=(S.ntcls&&S.ntcls.length?S.ntcls:defaultNewCls()).slice();S.ntcls=null;DS(k).topics.push(t);S.edOpen=t.id;S.dirty[k]=true;S.status='Tema dodana. Zdaj ji dodaj besede.';render();break}
  case 'save':saveDS(k);break;
  }
}
window.__androidBack=()=>{if(S.view==='home')return false;const v=(S.view==='my'||S.view==='admin'||S.view==='mnenje')?'settings':'home';act('nav',{dataset:{v}});return true};

app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();act(e.target.dataset.act,e.target)}});
app.addEventListener('input',e=>{const t=e.target,d=t.dataset;
  if(d.pi!==undefined&&PREV){PREV.items[+d.pi][d.f]=t.value}
  else if(d.nt&&PREV){PREV.nt[d.nt]=t.value}
  else if(d.cfg){CFG[d.cfg]=t.value.trim()}
  else if(d.paste){PASTE[d.paste]=t.value}
  else if(d.dq!==undefined){S.q=t.value;dictList()}

  else if(d.clsnew!==undefined){S.clsNew=t.value}
  else if(d.clsname!==undefined&&ADM){const cl=admClasses().map(c=>({...c}));const v=t.value.trim();if(v){cl[+d.clsname].name=v;ADM.classes=cl;S.dirty.pub=true;const sb=document.querySelector('[data-act=save][data-k=pub]');if(sb)sb.disabled=false}}
  else if(d.fbk){FBK[d.fbk]=t.value}
  else if(d.helptxt!==undefined){S.helptxt=t.value}
  else if(d.dcode!==undefined&&D){t.value=t.value.replace(/\D/g,'').slice(0,4);D.code=t.value}
  else if(d.fbtxt!==undefined){S.fbtxt=t.value}
  else if(d.fbdb!==undefined){S.fbdb=t.value}});
app.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.pcls!==undefined&&PREV){const v=[...document.querySelectorAll('[data-pcls]')].filter(x=>x.checked).map(x=>x.value);if(!v.length){t.checked=true;return}PREV.ncls=v;return}
  if(t.dataset.ntcls!==undefined){const v=[...document.querySelectorAll('[data-ntcls]')].filter(x=>x.checked).map(x=>x.value);if(!v.length){t.checked=true;return}S.ntcls=v;return}
  if(t.dataset.tcls!==undefined&&ADM){const tp=ADM.topics[+t.dataset.tcls];const all=[...document.querySelectorAll(`[data-tcls="${t.dataset.tcls}"]`)].filter(x=>x.checked).map(x=>x.value);
    if(!all.length){t.checked=true;S.status='Tema mora pripadati vsaj enemu razredu.'}else{tp.classes=all;S.dirty.pub=true;S.status='Razredi teme bodo spremenjeni po objavi.'}S.edOpen=tp.id;render();return}if(t.dataset.psel!==undefined&&PREV){PREV.sel=t.value;render()}else if(t.dataset.import!==undefined&&t.files&&t.files[0]){importMy(t.files[0]);t.value=''}});

/* UVODNI ZASLON: sovica se pojavi, pomežikne, pomaha z desno perutjo in v krogu odleti na svoje mesto v glavi.
   Dotik zaslona jo takoj postavi na končno mesto. Pri zmanjšanem gibanju uvod le zbledi. */
const SPL={done:false,anims:[],timers:[]};
function splA(el,k,o){try{const a=el.animate(k,o);SPL.anims.push(a);return a}catch(e){return null}}
function splT(fn,ms){SPL.timers.push(setTimeout(()=>{if(!SPL.done)fn()},ms))}
function splEnd(bounce){if(SPL.done)return;SPL.done=true;SPL.timers.forEach(clearTimeout);SPL.anims.forEach(a=>{try{a.cancel()}catch(e){}});
  document.getElementById('splash')?.remove();document.body.classList.remove('flying');
  const to=document.querySelector('#app .hero .owl');if(bounce&&to&&to.animate)to.animate([{transform:'none'},{transform:'scale(1.15)'},{transform:'scale(.95)'},{transform:'none'}],{duration:380,easing:'ease-out'})}
function splFade(){const el=document.getElementById('splash');if(!el)return splEnd(false);el.classList.add('fade');setTimeout(()=>splEnd(false),380)}
function splStart(){const el=document.getElementById('splash');if(!el)return;
  el.addEventListener('click',()=>splEnd(false));
  const owl=el.querySelector('.obox');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!owl.animate){owl.style.opacity=1;splT(splFade,900);return}
  const eyes=el.querySelector('.eyes'),wl=el.querySelector('.wl'),wr=el.querySelector('.wr');
  const blink=()=>splA(eyes,[{transform:'none'},{transform:'scaleY(.1)'},{transform:'none'}],{duration:180});
  splA(owl,[{transform:'scale(.5) translateY(30px)',opacity:0},{transform:'scale(1.06)',opacity:1,offset:.7},{transform:'none',opacity:1}],{duration:500,easing:'ease-out',fill:'forwards'});
  splT(blink,550);
  splT(()=>{splA(wl,[0,135,95,135,95,135,0].map(d=>({transform:`rotate(${d}deg)`})),{duration:1300,easing:'ease-in-out'});
    splA(owl,[{transform:'none'},{transform:'rotate(5deg)'},{transform:'rotate(-4deg)'},{transform:'rotate(5deg)'},{transform:'rotate(-4deg)'},{transform:'none'}],{duration:1300,easing:'ease-in-out',composite:'add'})},800);
  splT(blink,2050);
  splT(()=>splFly(el,owl,wl,wr),2250)}
function splFly(el,owl,wl,wr){const to=document.querySelector('#app .hero .owl');if(!to)return splFade();
  const a=owl.getBoundingClientRect(),b=to.getBoundingClientRect();
  if(!a.width||!b.width||b.bottom<0||b.top>innerHeight)return splFade();
  const sx=a.left+a.width/2,sy=a.top+a.height/2,tx=b.left+b.width/2,ty=b.top+(50/102)*b.height,k=(b.width/72)/(a.width/120);
  const W=[[0,0],[78,-30],[52,-120],[-30,-150],[tx-sx,ty-sy]];
  const cr=(p0,p1,p2,p3,t)=>{const t2=t*t,t3=t2*t;return [0,1].map(i=>.5*((2*p1[i])+(-p0[i]+p2[i])*t+(2*p0[i]-5*p1[i]+4*p2[i]-p3[i])*t2+(-p0[i]+3*p1[i]-3*p2[i]+p3[i])*t3))};
  const pt=u=>{const n=W.length-1,f=Math.min(u*n,n-1e-6),i=Math.floor(f),t=f-i;return cr(W[Math.max(i-1,0)],W[i],W[i+1],W[Math.min(i+2,n)],t)};
  const M=400,P=[],L=[0];for(let i=0;i<=M;i++){P.push(pt(i/M));if(i)L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]))}
  const at=d=>{let j=1;while(j<M&&L[j]<d)j++;const f=(d-L[j-1])/((L[j]-L[j-1])||1);return [P[j-1][0]+(P[j][0]-P[j-1][0])*f,P[j-1][1]+(P[j][1]-P[j-1][1])*f]};
  const ks=[],N=90;for(let i=0;i<=N;i++){const t=i/N,e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;const [x,y]=at(e*L[M]);
    ks.push({opacity:1,transform:`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${(-360*e).toFixed(2)}deg) scale(${(1+(k-1)*e).toFixed(4)})`})}
  const bgA=splA(el.querySelector('.sbg'),[{opacity:1},{opacity:1,offset:.5},{opacity:0}],{duration:2600,easing:'linear',fill:'forwards'});
  const fl=[0,-40,10,-40,10,-40,10,-40,0];
  splA(wr,fl.map(d=>({transform:`rotate(${d}deg)`})),{duration:1500});splA(wl,fl.map(d=>({transform:`rotate(${-d}deg)`})),{duration:1500});
  const f=splA(owl,ks,{duration:1500,easing:'linear',fill:'forwards'});
  if(!f)return splEnd(true);
  f.onfinish=()=>{if(bgA&&bgA.playState!=='finished')bgA.onfinish=()=>splEnd(true);else splEnd(true)}}
render();splStart();loadPub().then(()=>{trackOpen();setTimeout(flushStats,15000)});
